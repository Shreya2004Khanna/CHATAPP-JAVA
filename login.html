<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONNECT.LY Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
      <source src="bg.mp4" type="video/mp4" />
    </video>

    <!-- CONNECT.LY Logo -->
    <img src="connect.ly.png" class="app-logo" alt="CONNECT.LY" />

    <!-- Login Container -->
    <div class="login-container">
      <img src="login.png" class="login-title" alt="Login" />

      <!-- USERNAME + ROOM CODE INPUTS -->
      <div id="poda">
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="darkBorderBg"></div>
        <div class="darkBorderBg"></div>
        <div class="darkBorderBg"></div>

        <div class="white"></div>
        <div class="border"></div>

        <div id="main">
          <input
            id="username"
            placeholder="Enter your name..."
            type="text"
            class="input"
          />
          <input
            id="roomCode"
            placeholder="Room code (leave blank to create)"
            type="text"
            class="input"
            style="margin-top: 12px"
          />
        </div>
      </div>

      <div
        id="roomCodeBox"
        style="display: none; margin-top: 18px; text-align: center; width: 100%"
      >
        <div
          style="
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 6px;
            color: white;
          "
        >
          YOUR ROOM CODE
        </div>
        <div
          id="generatedRoomCode"
          style="
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #c3f3ff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            display: inline-block;
            min-width: 180px;
          "
        >
          -
        </div>
      </div>

      <div
        style="
          display: flex;
          gap: 12px;
          width: 100%;
          justify-content: center;
          margin-top: 18px;
          flex-wrap: wrap;
        "
      >
        <button class="login-btn" onclick="loginUser(true)">Create Room</button>
        <button class="login-btn" onclick="loginUser(false)">Join Room</button>
      </div>
    </div>

    <script src="script2.js"></script>
  </body>
</html>
